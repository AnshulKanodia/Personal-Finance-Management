version: '3.8'

services:
  rupeepulse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rupeepulse_pwa
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - PIN_SECRET=${PIN_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/auth/check"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - rupeepulse-net

networks:
  rupeepulse-net:
    driver: bridge
